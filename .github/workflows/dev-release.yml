name: Dev Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "已提交到 main 的版本（例如 2.3.0，不含 -dev）"
        required: true
        type: string

permissions:
  contents: read

# 普通 push / PR 不发包；失败 job 可复用同一 run 的原构建 artifact。
concurrency:
  group: narra-dev-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '0401lucky/Narra' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      apk_sha256: ${{ steps.release.outputs.apk_sha256 }}
      version_code: ${{ steps.release.outputs.version_code }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release request
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./tools/dev-release.ps1 -Mode Preflight -Version $env:RELEASE_VERSION

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore and verify existing dev key
        shell: pwsh
        env:
          NARRA_DEV_KEYSTORE_BASE64: ${{ secrets.NARRA_DEV_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NARRA_DEV_KEYSTORE_BASE64)) { throw '缺少原 dev 签名 Secret。' }
          $signingDirectory = Join-Path $env:HOME '.android'
          New-Item -ItemType Directory -Path $signingDirectory -Force | Out-Null
          $signingFile = Join-Path $signingDirectory 'debug.keystore'
          [IO.File]::WriteAllBytes($signingFile, [Convert]::FromBase64String($env:NARRA_DEV_KEYSTORE_BASE64))
          ./tools/dev-release.ps1 -Mode VerifyKeystore -KeystorePath $signingFile

      - name: Test release guards
        shell: pwsh
        run: ./tools/tests/dev-release-startup.tests.ps1

      - name: Assemble signed debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Run JVM tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --console=plain --stacktrace

      - name: Verify screenshot baselines
        run: ./gradlew :app:testDebugUnitTest --tests "com.example.myapplication.ui.screenshot.*" -Proborazzi.test.verify=true --console=plain --stacktrace

      - name: Verify and freeze APK artifact
        id: release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./tools/dev-release.ps1 -Mode FreezeArtifact -Version $env:RELEASE_VERSION -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'narra-dev-artifact')

      - name: Upload signed APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/narra-dev-artifact/*.apk
            ${{ runner.temp }}/narra-dev-artifact/release-info.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $signingFile = Join-Path $env:HOME '.android/debug.keystore'
          if (Test-Path -LiteralPath $signingFile) { Remove-Item -LiteralPath $signingFile -Force }

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      publication_commit: ${{ steps.publish.outputs.publication_commit }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download original build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/narra-dev-artifact

      - name: Install pinned AWS CLI
        env:
          AWS_CLI_VERSION: "2.31.19"
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/awscliv2.zip" "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWS_CLI_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP/narra-aws-install"
          "$RUNNER_TEMP/narra-aws-install/aws/install" --bin-dir "$RUNNER_TEMP/narra-aws-bin" --install-dir "$RUNNER_TEMP/narra-aws-cli"
          echo "$RUNNER_TEMP/narra-aws-bin" >> "$GITHUB_PATH"

      - name: Verify R2 and publish metadata commit
        id: publish
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_JURISDICTION: ${{ vars.R2_JURISDICTION || 'default' }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: ./tools/dev-release.ps1 -Mode Publish -Version $env:RELEASE_VERSION -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'narra-dev-artifact')

  pages:
    needs: [build, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      release_version: ${{ inputs.version }}
      apk_sha256: ${{ needs.build.outputs.apk_sha256 }}
      publication_commit: ${{ needs.publish.outputs.publication_commit }}

  verify:
    needs: [build, publish, pages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verification tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify legacy public update entry
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: ./tools/dev-release.ps1 -Mode VerifyPublished -Version $env:RELEASE_VERSION -ExpectedSha256 $env:RELEASE_SHA256
