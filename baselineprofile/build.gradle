                    .replace('\r\n', '\n')
                    .replace('\r', '\n')
        }
        def dialoguePanelSource = normalizedSource(roleplayDialoguePanel)
        def autoScrollSource = normalizedSource(roleplayAutoScroll)
        def navigationOwnerSource = normalizedSource(navigationViewModelOwners)
        def observationSource = normalizedSource(roleplayObservationSupport)
        def offlineReplaySource = normalizedSource(roleplayOfflineReplaySupport)
        def roleplayViewModelSource = normalizedSource(roleplayViewModel)
        def aiPolicySource = normalizedSource(f3AiDependencyPolicy)
        def frameBenchmarkSource = normalizedSource(frameBenchmarks)
        def f3SmokeSource = normalizedSource(f3ContractSmoke)
        def requirements = [
                'START_OFFLINE_REPLAY 动作标签'             :
                        dialoguePanelSource.contains('START_OFFLINE_REPLAY') &&
                                dialoguePanelSource.contains('benchmarkActionTag'),
                'ROLEPLAY_STREAM_READY 初始强 ready'         :
                        dialoguePanelSource.contains('isOfflineReplayInitialReady') &&
                                dialoguePanelSource.contains('ROLEPLAY_STREAM_READY') &&
                                dialoguePanelSource.contains('benchmarkReadyTag'),
                'ROLEPLAY_STREAM_COMPLETE_READY 结束强 ready':
                        dialoguePanelSource.contains('isOfflineReplayCompleteReady') &&
                                dialoguePanelSource.contains('ROLEPLAY_STREAM_COMPLETE_READY') &&
                                dialoguePanelSource.contains('benchmarkReadyTag'),
                'F3 宏基准在测量区间等待结束 ready'            :
                        frameBenchmarkSource.contains(
                                'benchmark(BenchmarkScenario.F3_ROLEPLAY_STREAM_REPLAY)',
                        ) &&
                                frameBenchmarkSource.contains(
                                        'readyId = BenchmarkReadyIds.ROLEPLAY_STREAM_COMPLETE_READY',
                                ),
                'F3 正向 smoke 强等待首次与结束 ready'         :
                        f3SmokeSource.contains(
                                'waitForReadyOrThrow(BenchmarkReadyIds.ROLEPLAY_STREAM_READY)',
                        ) &&
                                f3SmokeSource.contains(
                                        'assertNodePresent(BenchmarkActionIds.START_OFFLINE_REPLAY)',
                                ) &&
                                f3SmokeSource.contains(
                                        'readyId = BenchmarkReadyIds.ROLEPLAY_STREAM_COMPLETE_READY',
                                ),
                'F3 runtime policy 选择固定离线重放'          :
                        navigationOwnerSource.contains(
                                'benchmarkRuntimePolicy?.useOfflineRoleplayReplay == true',
