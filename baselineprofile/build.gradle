def parseBenchmarkJson = { File file, String label ->
    try {
        return new JsonSlurper().parse(file)
    } catch (Exception exception) {
        throw new GradleException("${label} JSON 无法解析：${file.name}", exception)
    }
}
def metricRuns = { benchmark, metricName ->
    def metrics = benchmark?.metrics
    if (!(metrics instanceof Map)) {
        return null
    }
    def metric = metrics[metricName]
    if (!(metric instanceof Map) || !(metric.runs instanceof List)) {
        return null
    }
    if (metric.runs.any { !(it instanceof Number) || !Double.isFinite((it as Number).doubleValue()) }) {
        return null
    }
    return metric.runs.collect { (it as Number).doubleValue() }
}
def evaluateBenchmarkEvidence = { benchmarkJsons, environmentManifests, availableFiles, expectedRunId ->
    def issues = []
    def missingBenchmarkCases = []
    def missingEnvironmentManifests = []
    def duplicateBenchmarkCases = []
    def duplicateEnvironmentManifests = []
    def invalidMetrics = []
    def missingPerfettoTraces = []
    def missingSections = []
    def traceOwners = [:].withDefault { [] }

    benchmarkJsons.each { entry ->
        if (entry.data?.context?.payload?.narraRunId != expectedRunId) {
            issues.add("benchmark JSON runId 不匹配：${entry.file.name}")
        }
        if (!(entry.data?.benchmarks instanceof List)) {
            issues.add("benchmark JSON 缺少 benchmarks：${entry.file.name}")
        }
    }
    environmentManifests.each { entry ->
        if (entry.data?.runId != expectedRunId) {
            issues.add("环境 manifest runId 不匹配：${entry.file.name}")
        }
    }

    def benchmarkRecords = benchmarkJsons.collectMany { entry ->
        (entry.data?.benchmarks instanceof List ? entry.data.benchmarks : []).collect { benchmark ->
            [file: entry.file, benchmark: benchmark]
        }
    }
    def environmentByName = environmentManifests.groupBy { entry -> entry.data?.benchmarkName as String }
    def scenarioSummaries = macroBenchmarkCases.collect { benchmarkCase ->
        def scenario = benchmarkCase.scenario
        def benchmarkMatches = benchmarkRecords.findAll { record ->
            def actualName = record.benchmark?.name as String
            actualName != null && (
                    actualName == benchmarkCase.benchmarkName ||
                            actualName.endsWith(benchmarkCase.benchmarkName)
            )
        }
        def manifestMatches = environmentByName[benchmarkCase.benchmarkName] ?: []
        if (benchmarkMatches.isEmpty()) {
            missingBenchmarkCases.add(benchmarkCase.benchmarkName)
        } else if (benchmarkMatches.size() != 1) {
            duplicateBenchmarkCases.add("${benchmarkCase.benchmarkName}:${benchmarkMatches.size()}")
        }
        if (manifestMatches.isEmpty()) {
            missingEnvironmentManifests.add(benchmarkCase.benchmarkName)
        } else if (manifestMatches.size() != 1) {
            duplicateEnvironmentManifests.add("${benchmarkCase.benchmarkName}:${manifestMatches.size()}")
        }

        def benchmarkRecord = benchmarkMatches.size() == 1 ? benchmarkMatches[0] : null
        def benchmark = benchmarkRecord?.benchmark
        def manifestEntry = manifestMatches.size() == 1 ? manifestMatches[0] : null
        def manifest = manifestEntry?.data
        if (manifest != null) {
            def expectedManifestValues = [
                    schemaVersion           : 1,
                    runId                   : expectedRunId,
                    benchmarkName           : benchmarkCase.benchmarkName,
                    scenarioId              : scenario.scenarioId,
                    phase                   : scenario.phaseId,
                    fixtureVersion          : benchmarkFixtureVersion,
                    iterations              : benchmarkCase.iterations,
                    compilationMode         : benchmarkCase.compilationMode,
                    buildMode               : 'baseline',
                    commit                  : benchmarkCommit,
                    androidxBenchmarkVersion: libs.versions.benchmarkMacroJunit4.get(),
                    agpVersion              : libs.versions.agp.get(),
                    gradleVersion           : gradle.gradleVersion,
                    jdkVersion              : System.getProperty('java.version', 'unknown'),
            ]
            expectedManifestValues.each { field, expected ->
                if (manifest[field] != expected) {
                    issues.add(
                            "${benchmarkCase.benchmarkName} 环境 manifest ${field}=" +
                                    "${manifest[field]}, expected=${expected}",
                    )
                }
            }
            if (!(manifest.createdAtEpochMillis instanceof Number) || manifest.createdAtEpochMillis <= 0L) {
                issues.add("${benchmarkCase.benchmarkName} 缺少有效 createdAtEpochMillis")
            }
            if (!(manifest.appVersionName instanceof String) || manifest.appVersionName.trim().isEmpty()) {
                issues.add("${benchmarkCase.benchmarkName} 缺少 appVersionName")
            }
            if (!(manifest.appVersionCode instanceof Number) || manifest.appVersionCode <= 0L) {
                issues.add("${benchmarkCase.benchmarkName} 缺少有效 appVersionCode")
            }
            def environment = manifest.environment
            if (!(environment instanceof Map)) {
                issues.add("${benchmarkCase.benchmarkName} 缺少设备环境字段")
            } else {
                ['manufacturer', 'model', 'buildFingerprint'].each { field ->
                    if (!(environment[field] instanceof String) || environment[field].trim().isEmpty()) {
                        issues.add("${benchmarkCase.benchmarkName} 设备环境缺少 ${field}")
                    }
                }
                if (!(environment.apiLevel instanceof Number) || environment.apiLevel < 28) {
                    issues.add("${benchmarkCase.benchmarkName} 设备 API 无效")
                }
                if (!(environment.refreshRateHz instanceof Number) || environment.refreshRateHz <= 0.0d) {
                    issues.add("${benchmarkCase.benchmarkName} 刷新率无效")
                }
                ['windowAnimationScale', 'transitionAnimationScale', 'animatorDurationScale'].each { field ->
                    if (!(environment[field] instanceof Number)) {
                        issues.add("${benchmarkCase.benchmarkName} 动画缩放缺少 ${field}")
                    }
                }
                if (!(environment.batteryPercent instanceof Number) ||
                        environment.batteryPercent < 0 || environment.batteryPercent > 100) {
                    issues.add("${benchmarkCase.benchmarkName} 电量记录无效")
                }
                if (environment.apiLevel instanceof Number && environment.apiLevel >= 29 &&
                        !(environment.thermalStatus instanceof Number)) {
                    issues.add("${benchmarkCase.benchmarkName} 温控状态缺失")
                }
            }

            def expectedTraceManifest = scenario.traceKeys.collect { traceKey ->
                def traceSpec = benchmarkTraceCatalog[traceKey]
                [
                        sectionName        : traceSpec.sectionName,
                        presenceMetric     : "${traceSpec.metricLabel}PresenceFirstMs",
                        countMetric        : "${traceSpec.metricLabel}Count",
                        totalDurationMetric: "${traceSpec.metricLabel}TotalDurationSumMs",
                ]
            }
            def actualTraceManifest = manifest.requiredTraceSections
            if (!(actualTraceManifest instanceof List) || actualTraceManifest != expectedTraceManifest) {
                issues.add(
                        "${benchmarkCase.benchmarkName} requiredTraceSections 漂移：" +
                                "${actualTraceManifest}, expected=${expectedTraceManifest}",
                )
            }
        }

        def primaryMetricSummaries = benchmarkCase.primaryMetrics.collect { metricName ->
            def runs = metricRuns(benchmark, metricName)
            def valid = runs != null && runs.size() == benchmarkCase.iterations
            if (!valid) {
                invalidMetrics.add(
                        "${benchmarkCase.benchmarkName}:${metricName}:" +
                                "${runs == null ? 'missing' : runs.size()}/${benchmarkCase.iterations}",
                )
            }
            return [
                    metricName: metricName,
                    valid     : valid,
                    runs      : runs ?: [],
                    p50       : valid ? percentileOf(runs, 50) : null,
                    p90       : valid ? percentileOf(runs, 90) : null,
                    p95       : valid ? percentileOf(runs, 95) : null,
            ]
        }
        def sectionSummaries = scenario.traceKeys.collect { traceKey ->
            def traceSpec = benchmarkTraceCatalog[traceKey]
            def presenceMetric = "${traceSpec.metricLabel}PresenceFirstMs"
            def countMetric = "${traceSpec.metricLabel}Count"
            def durationMetric = "${traceSpec.metricLabel}TotalDurationSumMs"
            def presenceRuns = metricRuns(benchmark, presenceMetric)
            def countRuns = metricRuns(benchmark, countMetric)
            def durationRuns = metricRuns(benchmark, durationMetric)
            def metricShapeValid = [presenceRuns, countRuns, durationRuns].every { runs ->
                runs != null && runs.size() == benchmarkCase.iterations
            }
            if (!metricShapeValid) {
                invalidMetrics.add("${benchmarkCase.benchmarkName}:${traceSpec.sectionName}:TraceMetricShape")
            }
            def present = metricShapeValid && countRuns.every { it > 0.0d }
            if (!present) {
                missingSections.add("${scenario.scenarioId}:${traceSpec.sectionName}")
            }
            return [
                    sectionName        : traceSpec.sectionName,
                    present            : present,
                    expectedIterations : benchmarkCase.iterations,
                    presenceRuns       : presenceRuns ?: [],
                    countRuns          : countRuns ?: [],
                    totalDurationRunsMs: durationRuns ?: [],
                    count              : countRuns?.sum(0.0d) ?: 0.0d,
                    totalDurationMs    : durationRuns?.sum(0.0d) ?: 0.0d,
                    p50DurationMs      : metricShapeValid ? percentileOf(durationRuns, 50) : null,
                    p90DurationMs      : metricShapeValid ? percentileOf(durationRuns, 90) : null,
                    p95DurationMs      : metricShapeValid ? percentileOf(durationRuns, 95) : null,
            ]
        }

        def profilerOutputs = benchmark?.profilerOutputs instanceof List ? benchmark.profilerOutputs : []
        def traceNames = profilerOutputs.findAll { output -> output?.type == 'PerfettoTrace' }
                .collect { output -> output?.filename as String }
                .findAll { name -> name != null && !name.trim().isEmpty() }
        if (traceNames.isEmpty()) {
            missingPerfettoTraces.add("${benchmarkCase.benchmarkName}:unreferenced")
        }
        traceNames.each { traceName ->
            def matches = availableFiles.findAll { file -> file.name == new File(traceName).name }
            if (matches.size() != 1 || matches[0].length() <= 0L) {
                missingPerfettoTraces.add("${benchmarkCase.benchmarkName}:${traceName}:${matches.size()}")
            } else {
                traceOwners[traceName].add(benchmarkCase.benchmarkName)
            }
        }
        return [
                benchmarkName           : benchmarkCase.benchmarkName,
                scenarioId              : scenario.scenarioId,
                expectedIterations      : benchmarkCase.iterations,
                benchmarkRecordCount    : benchmarkMatches.size(),
                environmentManifestCount: manifestMatches.size(),
                benchmarkJson           : benchmarkRecord?.file?.name,
                primaryMetrics          : primaryMetricSummaries,
                sections                : sectionSummaries,
                perfettoTraces          : traceNames,
        ]
    }
    traceOwners.findAll { traceName, owners -> owners.toSet().size() != 1 }.each { traceName, owners ->
        missingPerfettoTraces.add("shared:${traceName}:${owners.unique().sort()}")
    }
    issues.addAll(missingBenchmarkCases.collect { "缺少 benchmark case：${it}" })
    issues.addAll(missingEnvironmentManifests.collect { "缺少环境 manifest：${it}" })
    issues.addAll(duplicateBenchmarkCases.collect { "benchmark case 不唯一：${it}" })
    issues.addAll(duplicateEnvironmentManifests.collect { "环境 manifest 不唯一：${it}" })
    issues.addAll(invalidMetrics.collect { "指标缺失或迭代错误：${it}" })
    issues.addAll(missingPerfettoTraces.collect { "Perfetto 缺失或不唯一：${it}" })
    issues.addAll(missingSections.collect { "必需 Trace 未发射：${it}" })
    def normalizedIssues = issues.unique().sort()
    return [
            schemaVersion                : 2,
            runId                        : expectedRunId,
            decidable                    : normalizedIssues.isEmpty(),
            issues                       : normalizedIssues,
            missingBenchmarkCases        : missingBenchmarkCases.unique().sort(),
            missingEnvironmentManifests  : missingEnvironmentManifests.unique().sort(),
            duplicateBenchmarkCases      : duplicateBenchmarkCases.unique().sort(),
            duplicateEnvironmentManifests: duplicateEnvironmentManifests.unique().sort(),
            invalidMetrics               : invalidMetrics.unique().sort(),
            missingPerfettoTraces        : missingPerfettoTraces.unique().sort(),
            missingSections              : missingSections.unique().sort(),
            scenarios                    : scenarioSummaries,
    ]
}

def archiveBenchmarkResults = tasks.register('archiveNarraBenchmarkResults') {
    group = 'benchmark'
    description = '归档并逐 case 校验 Macrobenchmark JSON、Perfetto、环境与 Trace 证据。'
    dependsOn(verifyBenchmarkContractDrift, prepareBenchmarkRun)
    def outputDir = layout.buildDirectory.dir("outputs/narra-benchmark-runs/${benchmarkRunId}")
    outputs.dir(outputDir)
    outputs.upToDateWhen { false }
    notCompatibleWithConfigurationCache('归档必须消费本次运行的动态 runId 与设备输出')
    doLast {
        def configuredSource = providers.gradleProperty('narraBenchmarkSourceDir').orNull
        def sourceRoots = configuredSource != null
                ? [rootProject.file(configuredSource)]
                : [
                    layout.buildDirectory.dir('outputs/connected_android_test_additional_output').get().asFile,
                    layout.buildDirectory.dir('outputs/managed_device_android_test_additional_output').get().asFile,
                    layout.buildDirectory.dir('outputs/androidTest-results').get().asFile,
                ]
        sourceRoots = sourceRoots.findAll { it.isDirectory() }
        if (sourceRoots.isEmpty()) {
            throw new GradleException('未找到 AndroidTest additional output；无法归档 AC4 原始结果')
        }
        def sourceFiles = sourceRoots.collectMany { root ->
            fileTree(root).matching { include '**/*' }.files.findAll { it.isFile() }
        }.unique { it.absolutePath }
        def benchmarkJsonCandidates = sourceFiles.findAll { it.name.endsWith('-benchmarkData.json') }
        def benchmarkJsons = benchmarkJsonCandidates.collect { file ->
            [file: file, data: parseBenchmarkJson(file, 'Macrobenchmark')]
        }.findAll { entry -> entry.data?.context?.payload?.narraRunId == benchmarkRunId }
        if (benchmarkJsons.isEmpty()) {
            throw new GradleException("未找到 runId=${benchmarkRunId} 的原始 Macrobenchmark JSON")
        }
        def environmentManifests = sourceFiles.findAll { file ->
            file.name.startsWith("narra-environment-${benchmarkRunId}-") && file.name.endsWith('.json')
        }.collect { file ->
            [file: file, data: parseBenchmarkJson(file, '环境 manifest')]
        }
        if (environmentManifests.isEmpty()) {
            throw new GradleException("未找到 runId=${benchmarkRunId} 的设备环境 manifest")
        }
        def evidenceSummary = evaluateBenchmarkEvidence(
                benchmarkJsons,
                environmentManifests,
                sourceFiles,
                benchmarkRunId,
        )
        def referencedTraceNames = benchmarkJsons.collectMany { entry ->
            (entry.data?.benchmarks instanceof List ? entry.data.benchmarks : []).collectMany { benchmark ->
                (benchmark?.profilerOutputs instanceof List ? benchmark.profilerOutputs : [])
                        .findAll { output -> output?.type == 'PerfettoTrace' }
                        .collect { output -> output?.filename as String }
                        .findAll { name -> name != null && !name.trim().isEmpty() }
                        .collect { name -> new File(name).name }
            }
        }.findAll { it != null && !it.trim().isEmpty() }.unique()
        def perfettoFiles = referencedTraceNames.collectMany { traceName ->
            def matches = sourceFiles.findAll { file -> file.name == traceName }
            return matches.size() == 1 ? matches : []
        }.unique { it.absolutePath }

        def runDir = outputDir.get().asFile
        if (runDir.exists() && (runDir.listFiles()?.length ?: 0) > 0) {
            throw new GradleException("benchmark 归档目录已存在，拒绝覆盖：${runDir}")
        }
        def copyCategory = { files, category ->
            def duplicateNames = files.groupBy { it.name }.findAll { name, matches -> matches.size() != 1 }
            if (!duplicateNames.isEmpty()) {
                throw new GradleException("${category} 归档文件名不唯一：${duplicateNames.keySet()}")
            }
            files.each { source ->
                def destination = new File(runDir, "${category}/${source.name}")
                destination.parentFile.mkdirs()
                if (destination.exists()) {
                    throw new GradleException("归档文件名冲突：${destination.name}")
                }
                Files.copy(source.toPath(), destination.toPath(), StandardCopyOption.COPY_ATTRIBUTES)
            }
        }
        copyCategory(benchmarkJsons.collect { it.file }, 'raw/benchmark')
        copyCategory(perfettoFiles, 'raw/perfetto')
        copyCategory(environmentManifests.collect { it.file }, 'environment')

        def summaryFile = new File(runDir, 'benchmark-summary.json')
        summaryFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(evidenceSummary)), 'UTF-8')
        def evidenceFiles = fileTree(runDir).files.findAll { it.isFile() }.sort { it.path }
        def fileEntries = evidenceFiles.collect { file ->
            [
                    path  : runDir.toPath().relativize(file.toPath()).toString().replace('\\', '/'),
                    bytes : file.length(),
                    sha256: sha256Of(file),
            ]
        }
        def runManifest = [
                schemaVersion                   : 2,
                runId                           : benchmarkRunId,
                commit                          : benchmarkCommit,
                fixtureVersion                  : benchmarkFixtureVersion,
                androidxBenchmarkVersion        : libs.versions.benchmarkMacroJunit4.get(),
                archivedAtEpochMillis           : System.currentTimeMillis(),
                expectedBenchmarkCaseCount      : macroBenchmarkCases.size(),
                rawBenchmarkJsonCount           : benchmarkJsons.size(),
                perfettoTraceCount              : perfettoFiles.size(),
                environmentManifestCount        : environmentManifests.size(),
                benchmarkSummaryDecidable       : evidenceSummary.decidable,
                evidenceIssues                  : evidenceSummary.issues,
                missingBenchmarkCases           : evidenceSummary.missingBenchmarkCases,
                missingEnvironmentManifests     : evidenceSummary.missingEnvironmentManifests,
                duplicateBenchmarkCases         : evidenceSummary.duplicateBenchmarkCases,
                duplicateEnvironmentManifests   : evidenceSummary.duplicateEnvironmentManifests,
                invalidMetrics                  : evidenceSummary.invalidMetrics,
                missingPerfettoTraces           : evidenceSummary.missingPerfettoTraces,
                missingSections                 : evidenceSummary.missingSections,
                files                           : fileEntries,
        ]
        def runManifestFile = new File(runDir, 'run-manifest.json')
        runManifestFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(runManifest)), 'UTF-8')
        def checksumFiles = fileTree(runDir).files.findAll {
            it.isFile() && it.name != 'sha256sums.txt'
        }.sort { it.path }
        def checksumText = checksumFiles.collect { file ->
            def relative = runDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            "${sha256Of(file)}  ${relative}"
        }.join('\n') + '\n'
        new File(runDir, 'sha256sums.txt').setText(checksumText, 'UTF-8')
        logger.lifecycle("Narra benchmark 证据已归档：${runDir}")
    }
}

archiveBenchmarkResults.configure {
    mustRunAfter('connectedBenchmarkReleaseAndroidTest')
}

def verifyBenchmarkArchive = tasks.register('verifyNarraBenchmarkArchive') {
    group = 'verification'
    description = '重新解析并严格验证逐 case 证据、Trace presence 与全部 SHA-256。'
    dependsOn(verifyF3Integration, archiveBenchmarkResults)
    doLast {
        def runDir = layout.buildDirectory.dir("outputs/narra-benchmark-runs/${benchmarkRunId}").get().asFile
        def requiredFiles = [
                new File(runDir, 'benchmark-summary.json'),
                new File(runDir, 'run-manifest.json'),
                new File(runDir, 'sha256sums.txt'),
        ]
        requiredFiles.each { file ->
            if (!file.isFile() || file.length() <= 0L) {
                throw new GradleException("benchmark 归档缺少必需文件：${file.name}")
            }
        }
        def archivedBenchmarkFiles = fileTree(new File(runDir, 'raw/benchmark')).files.findAll { it.isFile() }
        def archivedEnvironmentFiles = fileTree(new File(runDir, 'environment')).files.findAll { it.isFile() }
        def archivedPerfettoFiles = fileTree(new File(runDir, 'raw/perfetto')).files.findAll { it.isFile() }
        def archivedBenchmarkJsons = archivedBenchmarkFiles.collect { file ->
            [file: file, data: parseBenchmarkJson(file, '归档 Macrobenchmark')]
        }
        def archivedEnvironmentManifests = archivedEnvironmentFiles.collect { file ->
            [file: file, data: parseBenchmarkJson(file, '归档环境 manifest')]
        }
        def evaluated = evaluateBenchmarkEvidence(
                archivedBenchmarkJsons,
                archivedEnvironmentManifests,
                archivedPerfettoFiles,
                benchmarkRunId,
        )
        def summary = parseBenchmarkJson(new File(runDir, 'benchmark-summary.json'), 'benchmark summary')
        def normalizedEvaluated = new JsonSlurper().parseText(JsonOutput.toJson(evaluated))
        if (summary != normalizedEvaluated) {
            throw new GradleException('benchmark-summary.json 与归档原始证据重新计算结果不一致')
        }
        def runManifest = parseBenchmarkJson(new File(runDir, 'run-manifest.json'), 'run manifest')
        def expectedManifestFields = [
                schemaVersion             : 2,
                runId                     : benchmarkRunId,
                commit                    : benchmarkCommit,
                fixtureVersion            : benchmarkFixtureVersion,
                androidxBenchmarkVersion  : libs.versions.benchmarkMacroJunit4.get(),
                expectedBenchmarkCaseCount: macroBenchmarkCases.size(),
                rawBenchmarkJsonCount     : archivedBenchmarkJsons.size(),
                perfettoTraceCount         : archivedPerfettoFiles.size(),
                environmentManifestCount  : archivedEnvironmentManifests.size(),
                benchmarkSummaryDecidable : evaluated.decidable,
                evidenceIssues            : evaluated.issues,
                missingBenchmarkCases     : evaluated.missingBenchmarkCases,
                missingEnvironmentManifests: evaluated.missingEnvironmentManifests,
                duplicateBenchmarkCases   : evaluated.duplicateBenchmarkCases,
                duplicateEnvironmentManifests: evaluated.duplicateEnvironmentManifests,
                invalidMetrics            : evaluated.invalidMetrics,
                missingPerfettoTraces     : evaluated.missingPerfettoTraces,
                missingSections           : evaluated.missingSections,
        ]
        expectedManifestFields.each { field, expected ->
            if (runManifest[field] != expected) {
                throw new GradleException("run-manifest ${field} 不匹配：${runManifest[field]}")
            }
        }
        if (!(runManifest.archivedAtEpochMillis instanceof Number) || runManifest.archivedAtEpochMillis <= 0L) {
            throw new GradleException('run-manifest 缺少有效 archivedAtEpochMillis')
        }
        def manifestFiles = runManifest.files
        if (!(manifestFiles instanceof List) || manifestFiles.isEmpty()) {
            throw new GradleException('run-manifest 缺少文件清单')
        }
        def manifestPaths = manifestFiles.collect { entry -> entry.path as String }
        if (manifestPaths.toSet().size() != manifestPaths.size()) {
            throw new GradleException('run-manifest 文件路径不唯一')
        }
        def expectedManifestPaths = fileTree(runDir).files.findAll { file ->
            file.isFile() && !(file.name in ['run-manifest.json', 'sha256sums.txt'])
        }.collect { file ->
            runDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
        }.sort()
        if (manifestPaths.sort() != expectedManifestPaths) {
            throw new GradleException('run-manifest 文件清单未完整覆盖原始证据')
        }
        manifestFiles.each { entry ->
            def relativePath = entry.path as String
            def resolved = new File(runDir, relativePath).canonicalFile
            if (!resolved.toPath().startsWith(runDir.canonicalFile.toPath()) || !resolved.isFile()) {
                throw new GradleException("run-manifest 文件路径越界或缺失：${relativePath}")
            }
            if (resolved.length() != (entry.bytes as Number).longValue() || sha256Of(resolved) != entry.sha256) {
                throw new GradleException("run-manifest 文件元数据不匹配：${relativePath}")
            }
        }

        def checksumFile = new File(runDir, 'sha256sums.txt')
        def checksumLines = checksumFile.readLines('UTF-8').findAll { !it.trim().isEmpty() }
        def checksumEntries = checksumLines.collect { line ->
            def matcher = line =~ /^([a-f0-9]{64})  ([^\r\n]+)$/
            if (!matcher.matches()) {
                throw new GradleException("无效 SHA-256 行：${line}")
            }
            return [sha256: matcher.group(1), path: matcher.group(2)]
        }
        def checksumPaths = checksumEntries.collect { it.path }
        if (checksumPaths.toSet().size() != checksumPaths.size()) {
            throw new GradleException('sha256sums.txt 存在重复路径')
        }
        def expectedChecksumPaths = fileTree(runDir).files.findAll {
            it.isFile() && it.name != 'sha256sums.txt'
        }.collect { file ->
            runDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
        }.sort()
        if (checksumPaths.sort() != expectedChecksumPaths) {
            throw new GradleException('sha256sums.txt 未完整覆盖归档文件')
        }
        checksumEntries.each { entry ->
            def file = new File(runDir, entry.path).canonicalFile
            if (!file.toPath().startsWith(runDir.canonicalFile.toPath()) ||
                    !file.isFile() || sha256Of(file) != entry.sha256) {
                throw new GradleException("SHA-256 校验失败：${entry.path}")
            }
        }
        if (!evaluated.decidable) {
            throw new GradleException("benchmark 结果不可判定：${evaluated.issues.join('；')}")
        }
    }
}

tasks.register('runAndArchiveNarraBenchmarks') {
    group = 'benchmark'
    description = '运行完整 baseline 宏基准，并仅在 F3 接线及逐 case 证据完整时通过。'
    dependsOn(verifyF3Integration, 'connectedBenchmarkReleaseAndroidTest', verifyBenchmarkArchive)
}
