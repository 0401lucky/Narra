def resolveGitCommit = {
    def headFile = rootProject.file('.git/HEAD')
    if (!headFile.isFile()) {
        return 'unknown'
    }
    def head = headFile.getText('UTF-8').trim()
    if (!head.startsWith('ref: ')) {
        return head ?: 'unknown'
    }
    def refName = head.substring('ref: '.length())
    def refFile = rootProject.file(".git/${refName}")
    if (refFile.isFile()) {
        return refFile.getText('UTF-8').trim() ?: 'unknown'
    }
    def packedRefs = rootProject.file('.git/packed-refs')
    if (!packedRefs.isFile()) {
        return 'unknown'
    }
    def packedLine = packedRefs.readLines('UTF-8').find { line -> line.endsWith(" ${refName}") }
    return packedLine?.split(' ', 2)?.first() ?: 'unknown'
}
def benchmarkRunId = providers.gradleProperty('narraBenchmarkRunId')
        .orElse("run-${System.currentTimeMillis()}-${UUID.randomUUID().toString().replace('-', '').substring(0, 12)}")
        .get()
def benchmarkRunIdPattern = ~/^[A-Za-z0-9][A-Za-z0-9._-]{7,95}$/
if (!(benchmarkRunId ==~ benchmarkRunIdPattern)) {
    throw new GradleException(
            'narraBenchmarkRunId 必须为 8~96 位，且只能包含字母、数字、点、下划线和连字符。',
    )
}
def benchmarkCommit = providers.gradleProperty('narraBenchmarkCommit')
        .orElse(resolveGitCommit())
        .get()
def sha256Of = { file ->
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    return digest.digest().encodeHex().toString()
}
def percentileOf = { values, percentile ->
    if (values == null || values.isEmpty()) {
        return null
    }
    def sorted = values.collect { (it as Number).doubleValue() }.sort()
    def boundedPercentile = Math.max(0, Math.min(100, (percentile as Number).intValue()))
    def idealIndex = (boundedPercentile / 100.0d) * (sorted.size() - 1)
    int firstIndex = (int) idealIndex
    int secondIndex = Math.min(firstIndex + 1, sorted.size() - 1)
    def ratio = idealIndex - firstIndex
    return sorted[firstIndex] * (1.0d - ratio) + sorted[secondIndex] * ratio
}

