                                navigationOwnerSource.contains(
                                        'BenchmarkOfflineReplaySpec.DEFAULT.takeIf',
                                ),
                'F3 fail-closed AI 依赖策略'                  :
                        aiPolicySource.contains('aiGateway = FailClosedF3AiGateway(tracker)') &&
                                aiPolicySource.contains(
                                        'aiPromptExtrasService = createFailClosedPromptExtrasService(tracker)',
                                ) &&
                                aiPolicySource.contains(
                                        'tracker.block(BenchmarkForbiddenAiOperation.AI_GATEWAY)',
                                ) &&
                                aiPolicySource.contains(
                                        'tracker.block(BenchmarkForbiddenAiOperation.AI_PROMPT_EXTRAS_SERVICE)',
                                ),
                'F3 fail-closed AI 依赖注入 RoleplayViewModel':
                        navigationOwnerSource.contains('F3BenchmarkAiDependencyPolicy.resolve(') &&
                                navigationOwnerSource.contains(
                                        'aiGateway = roleplayAiDependencies.aiGateway',
                                ) &&
                                navigationOwnerSource.contains(
                                        'aiPromptExtrasService = roleplayAiDependencies.aiPromptExtrasService',
                                ) &&
                                navigationOwnerSource.contains(
                                        'benchmarkAiViolationTracker = roleplayAiDependencies.violationTracker',
                                ),
                'F3 Provider 违规追踪器传入 replay support'    :
                        roleplayViewModelSource.contains(
                                'aiViolationTracker = benchmarkAiViolationTracker',
                        ) &&
                                offlineReplaySource.contains(
                                        'aiViolationTracker?.addViolationListener',
                                ) &&
                                offlineReplaySource.contains('hasNoAiViolations') &&
                                offlineReplaySource.contains('failClosedIfActive()'),
                'ROLEPLAY_MAP_MESSAGES Trace 发射'            :
                        observationSource.contains('ROLEPLAY_MAP_MESSAGES') &&
                                observationSource.contains('.trace('),
                'ROLEPLAY_APPLY_MAPPED_MESSAGES Trace 发射'   :
                        observationSource.contains('ROLEPLAY_APPLY_MAPPED_MESSAGES') &&
                                observationSource.contains('.trace {'),
                'ROLEPLAY_AUTO_SCROLL Trace 发射'             :
                        autoScrollSource.contains('ROLEPLAY_AUTO_SCROLL') &&
                                autoScrollSource.contains('.traceAsync {'),
                'ROLEPLAY_REPLAY_PUMP Trace 发射'             :
                        offlineReplaySource.contains('ROLEPLAY_REPLAY_PUMP') &&
                                offlineReplaySource.contains('.trace(block)'),
        ]
        def missing = requirements.findAll { label, wired -> !wired }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "F3 离线流式重放依赖未接线，禁止产出伪基准：${missing.join('、')}",
            )
        }
    }
}

