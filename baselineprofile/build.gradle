def verifyBenchmarkArchiveRules = tasks.register('verifyNarraBenchmarkArchiveRules') {
    group = 'verification'
    description = '自验证 Narra benchmark 场景矩阵、迭代、指标和 Trace 归档规则。'
    doLast {
        def expectedScenarioNames = [
                'S0_FIRST_RUN_STARTUP',
                'S1_RETURNING_CORE_STARTUP',
                'S2_POPULATED_STARTUP',
                'S3_UPGRADE_STARTUP',
                'F1_CHAT_SCROLL',
                'F2_ROLEPLAY_SCROLL',
                'F3_ROLEPLAY_STREAM_REPLAY',
                'N1_HEAVY_NAVIGATION',
                'P1_BASELINE_PROFILE',
        ]
        def actualScenarioNames = benchmarkScenarioMatrix.collect { it.enumName }
        if (actualScenarioNames != expectedScenarioNames) {
            throw new GradleException("benchmark 场景矩阵不完整或顺序漂移：${actualScenarioNames}")
        }
        def benchmarkNames = macroBenchmarkCases.collect { it.benchmarkName }
        if (benchmarkNames.size() != 12 || benchmarkNames.toSet().size() != benchmarkNames.size()) {
            throw new GradleException("宏基准 case 必须唯一且精确为 12 个：${benchmarkNames}")
        }
        def startupCases = macroBenchmarkCases.findAll {
            it.primaryMetrics == ['timeToInitialDisplayMs']
        }
        if (startupCases.size() != 8 || startupCases.any { it.iterations != 10 }) {
            throw new GradleException('S0～S3 的 None/Require 启动基准必须各运行 10 次')
        }
        def frameCases = macroBenchmarkCases - startupCases
        if (frameCases.size() != 4 || frameCases.any {
            it.iterations != 5 || it.primaryMetrics != ['frameDurationCpuMs', 'frameOverrunMs']
        }) {
            throw new GradleException('F1～F3/N1 必须各运行 5 次并同时输出两项帧指标')
        }
        def p1 = benchmarkScenarioMatrix.find { it.enumName == 'P1_BASELINE_PROFILE' }
        def expectedP1Traces = [
                'SETTINGS_DECODE',
                'FIRST_MESSAGE_MAP',
                'ROLEPLAY_MAP_MESSAGES',
        ]
        if (p1 == null || p1.phaseId != 'profile' || p1.traceKeys != expectedP1Traces) {
            throw new GradleException('P1 必须保持 profile phase 与三项必需 Trace 合约')
        }
        def f3 = benchmarkScenarioMatrix.find { it.enumName == 'F3_ROLEPLAY_STREAM_REPLAY' }
        if (f3?.traceKeys != [
                'ROLEPLAY_MAP_MESSAGES',
                'ROLEPLAY_APPLY_MAPPED_MESSAGES',
                'ROLEPLAY_AUTO_SCROLL',
                'ROLEPLAY_REPLAY_PUMP',
        ]) {
            throw new GradleException('F3 必须消费 RP 映射、状态回写、自动贴底与 replay pump Trace')
        }
        def unknownTraceKeys = benchmarkScenarioMatrix.collectMany { it.traceKeys }.toSet() -
                benchmarkTraceCatalog.keySet()
        if (!unknownTraceKeys.isEmpty()) {
            throw new GradleException("场景引用了未登记 Trace：${unknownTraceKeys}")
        }
        def metricLabels = benchmarkTraceCatalog.values().collect { it.metricLabel }
        if (metricLabels.toSet().size() != metricLabels.size()) {
            throw new GradleException('Trace metric label 必须唯一')
        }
    }
}

def verifyBenchmarkContractDrift = tasks.register('verifyNarraBenchmarkContractDrift') {
    group = 'verification'
    description = '校验 S0～P1 session/fixture/ready/Trace 镜像没有偏离 app 唯一合约。'
    dependsOn(verifyBenchmarkArchiveRules)
    def appBenchmarkContract = rootProject.file(
            'app/src/main/java/com/example/myapplication/system/performance/BenchmarkContract.kt',
    )
    def appTraceContract = rootProject.file(
            'app/src/main/java/com/example/myapplication/system/performance/PerformanceTraceContract.kt',
    )
    def appReadyContract = rootProject.file(
            'app/src/main/java/com/example/myapplication/system/performance/BenchmarkReadyContract.kt',
    )
    def appSessionCodec = rootProject.file(
            'app/src/main/java/com/example/myapplication/system/performance/BenchmarkSessionCodec.kt',
    )
    def appFixtureProtocol = rootProject.file(
            'app/src/baseline/java/com/example/myapplication/system/performance/BenchmarkFixtureProtocol.kt',
    )
    def baselineContract = file(
            'src/main/java/com/example/myapplication/baselineprofile/BenchmarkScenarioContract.kt',
    )
    def baselineFixtureClient = file(
            'src/main/java/com/example/myapplication/baselineprofile/BenchmarkFixtureClient.kt',
    )
    def baselineReadyAssertions = file(
            'src/main/java/com/example/myapplication/baselineprofile/ReadyAssertions.kt',
    )
    inputs.files(
            appBenchmarkContract,
            appTraceContract,
            appReadyContract,
            appSessionCodec,
            appFixtureProtocol,
            baselineContract,
            baselineFixtureClient,
            baselineReadyAssertions,
    )
    doLast {
        def readConst = { source, name ->
            def matcher = source =~ /const val ${java.util.regex.Pattern.quote(name)}\s*=\s*"([^"]+)"/
            if (!matcher.find()) {
                throw new GradleException("未找到合约常量 ${name}")
            }
            return matcher.group(1)
        }
        def readNumericConst = { source, name ->
            def matcher = source =~ /const val ${java.util.regex.Pattern.quote(name)}\s*=\s*([^\r\n]+)/
            if (!matcher.find()) {
                throw new GradleException("未找到数值合约常量 ${name}")
            }
            def expression = matcher.group(1).trim()
            if (!(expression ==~ /[0-9_L\s*]+/)) {
                throw new GradleException("数值合约常量 ${name} 使用了不受支持的表达式：${expression}")
            }
            return expression
                    .replace('_', '')
                    .replace('L', '')
                    .split(/\*/)
                    .collect { factor -> factor.trim().toLong() }
                    .inject(1L) { product, factor -> product * factor }
        }
        def readEnumWireId = { source, name ->
            def matcher = source =~ /(?m)^\s*${java.util.regex.Pattern.quote(name)}\("([^"]+)"\)[,;]?\s*$/
            if (!matcher.find()) {
                throw new GradleException("未找到枚举 wireId：${name}")
            }
            return matcher.group(1)
        }
        def appBenchmarkSource = appBenchmarkContract.getText('UTF-8')
        def appTraceSource = appTraceContract.getText('UTF-8')
        def appReadySource = appReadyContract.getText('UTF-8')
        def appSessionCodecSource = appSessionCodec.getText('UTF-8')
        def appFixtureProtocolSource = appFixtureProtocol.getText('UTF-8')
        def baselineSource = baselineContract.getText('UTF-8')
        def baselineFixtureClientSource = baselineFixtureClient.getText('UTF-8')
        // 统一源码行尾，避免 Windows core.autocrlf 将精确多行门禁误判为合约漂移。
        def baselineReadyAssertionsSource = baselineReadyAssertions.getText('UTF-8')
                .replace('\r\n', '\n')
                .replace('\r', '\n')
        if ((baselineReadyAssertionsSource =~ /if\s*\(\s*!device\.pressBack\(\)\s*\)/).find()) {
            throw new GradleException('benchmark 返回操作不得依赖 UiDevice.pressBack() 的不可靠布尔值')
        }
        if (!(baselineReadyAssertionsSource =~ /device\.pressBack\(\)\s*waitForReadyOrThrow\(readyId\)/).find()) {
            throw new GradleException('benchmark 返回操作必须以目标 ready 作为结果断言')
        }
        if (!baselineReadyAssertionsSource.contains('bounds.top >= topClickGuardPx') ||
                !baselineReadyAssertionsSource.contains('bounds.bottom <= safeBottom')) {
            throw new GradleException('benchmark 点击安全区必须同时避开顶部状态栏与底部导航栏')
        }
        if (baselineReadyAssertionsSource.contains('if (clickCurrentSafeTarget(selector))')) {
            throw new GradleException('benchmark action deadline 到达后不得再点击目标控件')
        }
        if (!baselineReadyAssertionsSource.contains('val actionDeadline = SystemClock.uptimeMillis() + DEFAULT_ACTION_TIMEOUT_MILLIS') ||
                !baselineReadyAssertionsSource.contains('findAndClickOrThrow(\n            selector = actionSelector,\n            safeLabel = actionId,\n            deadline = actionDeadline,') ||
                !baselineReadyAssertionsSource.contains('clickCurrentSafeTarget(actionSelector, actionDeadline)')) {
            throw new GradleException('benchmark 首次点击、宽限等待与重试必须共享同一 action deadline')
        }
        if ((baselineReadyAssertionsSource =~ /clickCurrentSafeTarget\(actionSelector\s*\)/).find()) {
            throw new GradleException('benchmark 重试点击不得绕过 action deadline')
        }
        if (!(baselineReadyAssertionsSource =~ /(?s)private fun clickTargetIfSafe\(.*?deadline: Long,.*?remainingMillis\(deadline\) <= 0L.*?target\.click\(\)/).find()) {
            throw new GradleException('benchmark 必须在 UiObject2.click() 前最后检查 action deadline')
        }
        if (!baselineReadyAssertionsSource.contains('截止后只采样当前语义树用于错误信息，不再点击或滚动')) {
            throw new GradleException('benchmark action deadline 必须保留只读失败路径')
        }
        if (readConst(appBenchmarkSource, 'FIXTURE_VERSION') != readConst(baselineSource, 'FIXTURE_VERSION')) {
            throw new GradleException('baselineprofile FIXTURE_VERSION 已偏离 app BenchmarkContract')
        }
        ['SCHEMA_VERSION', 'DEFAULT_TTL_MILLIS', 'MAX_TTL_MILLIS'].each { name ->
            def expected = readNumericConst(appBenchmarkSource, name)
            def actual = readNumericConst(baselineFixtureClientSource, name)
            if (actual != expected) {
                throw new GradleException("benchmark 会话数值合约漂移：${name}=${actual}, expected=${expected}")
            }
        }
        ['MEASURE', 'PROFILE'].each { name ->
            def expected = readEnumWireId(appBenchmarkSource, name)
            def actual = readEnumWireId(baselineSource, name)
            if (actual != expected) {
                throw new GradleException("benchmark phase wireId 漂移：${name}=${actual}, expected=${expected}")
            }
        }
        if (
                readConst(appBenchmarkSource, 'SESSION_ID_INTENT_EXTRA') !=
                        readConst(baselineReadyAssertionsSource, 'SESSION_ID_INTENT_EXTRA')
        ) {
            throw new GradleException('benchmark session Intent extra 已偏离 app BenchmarkContract')
        }
        if (
                readConst(appFixtureProtocolSource, 'AUTHORITY_SUFFIX') !=
                        readConst(baselineFixtureClientSource, 'AUTHORITY_SUFFIX')
        ) {
            throw new GradleException('benchmark Provider authority 已在 app/client 间漂移')
        }
        ['METHOD_PREPARE', 'METHOD_CLEAR_SESSION'].each { name ->
            def expected = readConst(appFixtureProtocolSource, name)
            def actual = readConst(baselineFixtureClientSource, name)
            if (actual != expected) {
                throw new GradleException("benchmark Provider 方法合约漂移：${name}=${actual}, expected=${expected}")
            }
        }
        [
                'KEY_SESSION_DESCRIPTOR',
                'KEY_SUCCESS',
                'KEY_ERROR_CODE',
                'KEY_ERROR_MESSAGE',
                'KEY_FIXTURE_ID',
                'KEY_CHAT_MESSAGE_COUNT',
                'KEY_ROLEPLAY_MESSAGE_COUNT',
                'KEY_SAFE_SHA256',
        ].each { name ->
            def expected = readConst(appFixtureProtocolSource, name)
            def actual = readConst(baselineFixtureClientSource, name)
            if (actual != expected) {
                throw new GradleException("benchmark Provider Bundle 合约漂移：${name}=${actual}, expected=${expected}")
            }
        }
        [
                'SCHEMA_VERSION',
                'SESSION_ID',
                'SCENARIO_ID',
                'FIXTURE_VERSION',
                'PHASE',
                'CREATED_AT',
                'TTL',
        ].each { suffix ->
            def expected = readConst(appSessionCodecSource, "KEY_${suffix}")
            def actual = readConst(baselineFixtureClientSource, "DESCRIPTOR_KEY_${suffix}")
            if (actual != expected) {
                throw new GradleException(
                        "benchmark session descriptor 字段漂移：${suffix}=${actual}, expected=${expected}",
                )
            }
        }
        benchmarkTraceCatalog.each { traceName, traceSpec ->
            def expected = readConst(appTraceSource, traceName)
            def actual = readConst(baselineSource, "TRACE_${traceName}")
            if (actual != expected) {
                throw new GradleException("Trace 合约漂移：${traceName}=${actual}, expected=${expected}")
            }
            if (actual != traceSpec.sectionName) {
                throw new GradleException("Gradle Trace 目录漂移：${traceName}=${actual}")
            }
        }

        def enumBlock = { source, startMarker, endMarker ->
            int start = source.indexOf(startMarker)
            int end = source.indexOf(endMarker, start + startMarker.length())
            if (start < 0 || end < 0) {
                throw new GradleException("无法定位 Kotlin enum：${startMarker}")
            }
            return source.substring(start, end)
        }
        def entryNames = { block ->
            def matcher = block =~ /(?m)^\s{4}([A-Z][A-Z0-9_]+)\(/
            return matcher.collect { match -> match[1] }
        }
        def enumEntry = { block, name, nextName ->
            int start = block.indexOf("\n    ${name}(")
            if (start < 0) {
                throw new GradleException("未找到场景/fixture enum：${name}")
            }
            int end = nextName == null ? block.length() : block.indexOf("\n    ${nextName}(", start + 1)
            if (end < 0) {
                throw new GradleException("无法确定 enum ${name} 的结束位置")
            }
            return block.substring(start, end)
        }
        def requireFragment = { entry, fragment, context ->
            if (!entry.contains(fragment)) {
                throw new GradleException("${context} 漂移，缺少：${fragment}")
            }
        }

        def appFixtureBlock = enumBlock(
                appBenchmarkSource,
                'enum class BenchmarkFixtureId(',
                'enum class BenchmarkScenarioId(',
        )
        def fixtureSpecs = benchmarkScenarioMatrix.collectEntries { scenario ->
            [(scenario.fixtureEnum): scenario]
        }
        def fixtureNames = fixtureSpecs.keySet().toList()
        fixtureNames.eachWithIndex { fixtureName, index ->
            def spec = fixtureSpecs[fixtureName]
            def nextName = index + 1 < fixtureNames.size() ? fixtureNames[index + 1] : null
            def entry = enumEntry(appFixtureBlock, fixtureName, nextName)
            requireFragment(entry, "wireId = \"${spec.fixtureId}\"", "app fixture ${fixtureName}")
            requireFragment(entry, "chatMessageCount = ${spec.chatCount}", "app fixture ${fixtureName}")
            requireFragment(entry, "roleplayMessageCount = ${spec.roleplayCount}", "app fixture ${fixtureName}")
        }

        def expectedScenarioNames = benchmarkScenarioMatrix.collect { it.enumName }
        def appScenarioBlock = enumBlock(
                appBenchmarkSource,
                'enum class BenchmarkScenarioId(',
                'enum class BenchmarkPhase(',
        )
        def baselineScenarioBlock = enumBlock(
                baselineSource,
                'internal enum class BenchmarkScenario(',
                'internal object BenchmarkTraceSections',
        )
        if (entryNames(appScenarioBlock) != expectedScenarioNames) {
            throw new GradleException("app 场景矩阵漂移：${entryNames(appScenarioBlock)}")
        }
        if (entryNames(baselineScenarioBlock) != expectedScenarioNames) {
            throw new GradleException("baselineprofile 场景矩阵漂移：${entryNames(baselineScenarioBlock)}")
        }

        def returningTraceMatcher = baselineSource =~
                /(?s)val RETURNING_STARTUP\s*=\s*listOf\((.*?)\)/
        if (!returningTraceMatcher.find()) {
            throw new GradleException('baselineprofile 缺少 RETURNING_STARTUP Trace 列表')
        }
        def returningTraceKeys = (returningTraceMatcher.group(1) =~
                /\b([A-Z][A-Z0-9_]+)\b/).collect { match -> match[1] }
                .findAll { benchmarkTraceCatalog.containsKey(it) }
        if (returningTraceKeys != returningStartupTraceKeys) {
            throw new GradleException("RETURNING_STARTUP Trace 漂移：${returningTraceKeys}")
        }

        def appRequiredBlockStart = appTraceSource.indexOf('fun requiredSections(')
        def appRequiredBlockEnd = appTraceSource.indexOf('fun evaluate(', appRequiredBlockStart)
        if (appRequiredBlockStart < 0 || appRequiredBlockEnd < 0) {
            throw new GradleException('无法定位 PerformanceTraceContract.requiredSections')
        }
        def appRequiredBlock = appTraceSource.substring(appRequiredBlockStart, appRequiredBlockEnd)
        def appTraceMatrix = [:]
        def clauseMatcher = appRequiredBlock =~
                /(?s)((?:\s*BenchmarkScenarioId\.[A-Z0-9_]+\s*,?)+)\s*->\s*(emptySet\(\)|setOf\((.*?)\))/
        clauseMatcher.each { match ->
            def scenarioMatcher = match[1] =~ /BenchmarkScenarioId\.([A-Z0-9_]+)/
            def traceMatcher = match[2] =~ /\b([A-Z][A-Z0-9_]+)\b/
            def traceKeys = traceMatcher.collect { traceMatch -> traceMatch[1] }
                    .findAll { benchmarkTraceCatalog.containsKey(it) }
            scenarioMatcher.each { scenarioMatch ->
                def scenarioName = scenarioMatch[1]
                if (appTraceMatrix.containsKey(scenarioName)) {
                    throw new GradleException("requiredSections 重复声明场景：${scenarioName}")
                }
                appTraceMatrix[scenarioName] = traceKeys
            }
        }
        if (appTraceMatrix.keySet().toList() != expectedScenarioNames) {
            throw new GradleException("app requiredSections 场景不完整：${appTraceMatrix.keySet()}")
        }

        benchmarkScenarioMatrix.eachWithIndex { scenario, index ->
            def nextName = index + 1 < benchmarkScenarioMatrix.size()
                    ? benchmarkScenarioMatrix[index + 1].enumName
                    : null
            def appEntry = enumEntry(appScenarioBlock, scenario.enumName, nextName)
            requireFragment(appEntry, "wireId = \"${scenario.scenarioId}\"", "app ${scenario.enumName}")
            requireFragment(
                    appEntry,
                    "fixtureId = BenchmarkFixtureId.${scenario.fixtureEnum}",
                    "app ${scenario.enumName}",
            )
            requireFragment(
                    appEntry,
                    "initialReadyId = BenchmarkReadyIds.${scenario.initialReady}",
                    "app ${scenario.enumName}",
            )

            def baselineEntry = enumEntry(baselineScenarioBlock, scenario.enumName, nextName)
            requireFragment(
                    baselineEntry,
                    "wireId = \"${scenario.scenarioId}\"",
                    "baselineprofile ${scenario.enumName}",
            )
            requireFragment(
                    baselineEntry,
                    "fixtureId = \"${scenario.fixtureId}\"",
                    "baselineprofile ${scenario.enumName}",
            )
            requireFragment(
                    baselineEntry,
                    "expectedChatMessageCount = ${scenario.chatCount}",
                    "baselineprofile ${scenario.enumName}",
            )
            requireFragment(
                    baselineEntry,
                    "expectedRoleplayMessageCount = ${scenario.roleplayCount}",
                    "baselineprofile ${scenario.enumName}",
            )
            requireFragment(
                    baselineEntry,
                    "phase = BenchmarkPhase.${scenario.phaseEnum}",
                    "baselineprofile ${scenario.enumName}",
            )
            requireFragment(
                    baselineEntry,
                    "initialReadyId = BenchmarkReadyIds.${scenario.initialReady}",
                    "baselineprofile ${scenario.enumName}",
            )
            def baselineTraceKeys = (baselineEntry =~
                    /BenchmarkTraceSections\.([A-Z0-9_]+)/).collect { match -> match[1] }
            if (baselineTraceKeys == ['RETURNING_STARTUP']) {
                baselineTraceKeys = returningTraceKeys
            }
            if (baselineTraceKeys != scenario.traceKeys) {
                throw new GradleException(
                        "baselineprofile ${scenario.enumName} Trace 漂移：${baselineTraceKeys}, " +
                                "expected=${scenario.traceKeys}",
                )
            }
            if (appTraceMatrix[scenario.enumName] != scenario.traceKeys) {
                throw new GradleException(
                        "app ${scenario.enumName} requiredSections 漂移：" +
                                "${appTraceMatrix[scenario.enumName]}, expected=${scenario.traceKeys}",
                )
            }
        }

        benchmarkTraceCatalog.each { traceName, traceSpec ->
            def metricMatcher = baselineSource =~
                    /(?s)val ${traceName}\s*=\s*BenchmarkTraceSection\(\s*BenchmarkWireContract\.TRACE_${traceName},\s*"([^"]+)"/
            if (!metricMatcher.find() || metricMatcher.group(1) != traceSpec.metricLabel) {
                throw new GradleException("Trace metric label 漂移：${traceName}")
            }
        }

        def readyAndActionNames = [
                'FIRST_RUN_CONSENT_READY',
                'RETURNING_ROLEPLAY_READY',
                'CHAT_LIST_READY',
                'CHAT_LIST_TOP_READY',
                'CHAT_LIST_BOTTOM_READY',
                'ROLEPLAY_LIST_READY',
                'ROLEPLAY_LIST_TOP_READY',
                'ROLEPLAY_LIST_BOTTOM_READY',
                'ROLEPLAY_STREAM_READY',
                'ROLEPLAY_STREAM_COMPLETE_READY',
                'SETTINGS_READY',
                'ROLEPLAY_QUICK_SETTINGS_READY',
                'READING_READY',
                'VOICE_SYNTHESIS_READY',
                'VOICE_PROFILE_READY',
                'OPEN_CHAT_HISTORY',
                'OPEN_SETTINGS',
                'OPEN_ROLEPLAY_QUICK_SETTINGS',
                'OPEN_READING',
                'OPEN_VOICE_SYNTHESIS',
                'OPEN_VOICE_PROFILE',
                'CLOSE_VOICE_PROFILE',
                'START_OFFLINE_REPLAY',
        ]
        readyAndActionNames.each { name ->
            def expected = readConst(appReadySource, name)
            def actual = readConst(baselineSource, name)
            if (actual != expected) {
                throw new GradleException("ready/action 合约漂移：${name}=${actual}, expected=${expected}")
            }
        }
    }
}

def verifyF3Integration = tasks.register('verifyNarraF3BenchmarkIntegration') {
