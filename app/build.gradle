def resolveBuildSecret = { String key ->
    def projectValue = project.findProperty(key)?.toString()?.trim()
    if (projectValue) {
        return projectValue
    }
    def localValue = localProperties.getProperty(key)?.trim()
    if (localValue) {
        return localValue
    }
    def envValue = System.getenv(key)?.trim()
    if (envValue) {
        return envValue
    }
    return ""
}

def appDisplayName = "Narra"
def appApplicationId = (project.findProperty("narraApplicationId") ?: "com.narra.app").toString()
def appVersionMajor = ((project.findProperty("appVersionMajorOverride") ?: "1").toString()).toInteger()
def appVersionMinor = ((project.findProperty("appVersionMinorOverride") ?: "4").toString()).toInteger()
def appVersionPatch = ((project.findProperty("appVersionPatchOverride") ?: "8").toString()).toInteger()
def appVersionSuffix = (project.findProperty("appVersionSuffixOverride") ?: "").toString()
def appVersionName = "${appVersionMajor}.${appVersionMinor}.${appVersionPatch}${appVersionSuffix}"
def appVersionCode = (appVersionMajor * 10000) + (appVersionMinor * 100) + appVersionPatch
def releaseChannelName = "release"
def devChannelName = "dev"
def baselineChannelName = "baseline"
def appUpdateMetadataBaseUrl = (project.findProperty("appUpdateMetadataBaseUrl") ?: "").toString()
def releaseStoreFilePath = resolveBuildSecret("NARRA_RELEASE_STORE_FILE")
def releaseStorePassword = resolveBuildSecret("NARRA_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = resolveBuildSecret("NARRA_RELEASE_KEY_ALIAS")
def releaseKeyPassword = resolveBuildSecret("NARRA_RELEASE_KEY_PASSWORD")
def hasReleaseSigningConfig = [
        releaseStoreFilePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword,
].every { value -> value?.trim() }

if (!hasReleaseSigningConfig) {
    logger.lifecycle("Narra release signing 未配置，assembleRelease 仍会生成未签名包。请在 local.properties、环境变量或 -P 参数中配置 NARRA_RELEASE_*。")
}

android {
    namespace 'com.example.myapplication'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId appApplicationId
        minSdk 26
        targetSdk 36
        // 版本规则：major.minor.patch
        // versionCode 规则：major * 10000 + minor * 100 + patch
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "String", "APP_DISPLAY_NAME", "\"${appDisplayName}\""
        buildConfigField "String", "APP_RELEASE_CHANNEL", "\"${releaseChannelName}\""
        buildConfigField "String", "APP_VERSION_NAME_VALUE", "\"${appVersionName}\""
        buildConfigField "int", "APP_VERSION_CODE_VALUE", "${appVersionCode}"
        buildConfigField "String", "APP_UPDATE_METADATA_BASE_URL", "\"${appUpdateMetadataBaseUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "APP_CHANNEL", "\"${releaseChannelName}\""
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "${appDisplayName} Dev"
            buildConfigField "String", "APP_CHANNEL", "\"${devChannelName}\""
        }
        baseline {
            initWith(release)
            matchingFallbacks = ['release']
            debuggable false
            minifyEnabled false
            shrinkResources false
            profileable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".baseline"
            versionNameSuffix "-baseline"
            resValue "string", "app_name", "${appDisplayName} Baseline"
            buildConfigField "String", "APP_CHANNEL", "\"${baselineChannelName}\""
        }
        benchmarkRelease {
            initWith(baseline)
            matchingFallbacks = ['baseline']
        }
        nonMinifiedRelease {
            initWith(baseline)
            matchingFallbacks = ['baseline']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
        compose true
        resValues true
    }
}

def requestedComposeArchiveVariants = gradle.startParameter.taskNames.collectMany { taskName ->
    def normalizedName = taskName.toLowerCase(Locale.ROOT)
    if (normalizedName.contains("generatedebugcomposecompilerreportarchive")) {
        return ["debug"]
    }
    if (normalizedName.contains("generatebaselinecomposecompilerreportarchive")) {
        return ["baseline"]
    }
    return []
}.unique()

if (requestedComposeArchiveVariants.size() > 1) {
    throw new GradleException("Compose Compiler 正式报告请按变体分别运行，避免两个全量编译共享中间产物。")
}

def taskRequestedComposeArchiveVariant = requestedComposeArchiveVariants.find()
def explicitComposeArchiveVariant = providers.gradleProperty("narraComposeReportVariant").orNull
if (explicitComposeArchiveVariant != null &&
        taskRequestedComposeArchiveVariant != null &&
        explicitComposeArchiveVariant != taskRequestedComposeArchiveVariant) {
    throw new GradleException(
            "Compose Compiler 报告变体冲突：任务要求 ${taskRequestedComposeArchiveVariant}，" +
                    "但 narraComposeReportVariant=${explicitComposeArchiveVariant}",
    )
}
def requestedComposeArchiveVariant = explicitComposeArchiveVariant ?: taskRequestedComposeArchiveVariant
if (requestedComposeArchiveVariant != null && !(requestedComposeArchiveVariant in ["debug", "baseline"])) {
    throw new GradleException("不支持的 Compose Compiler 报告变体：${requestedComposeArchiveVariant}")
}

def defaultComposeReportRunId = "${LocalDateTime.now().format(DateTimeFormatter.ofPattern('yyyyMMdd-HHmmss-SSS'))}-${UUID.randomUUID().toString().take(8)}"
def explicitComposeArchiveRunId = providers.gradleProperty("narraComposeReportRunId").orNull
if (explicitComposeArchiveRunId != null && requestedComposeArchiveVariant == null) {
    throw new GradleException("指定 narraComposeReportRunId 时必须同时运行正式报告任务或指定报告变体。")
}
def requestedComposeArchiveRunId = explicitComposeArchiveRunId ?:
        (requestedComposeArchiveVariant == null ? null : defaultComposeReportRunId)
def composeReportRunIdPattern = ~/^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$/
if (requestedComposeArchiveRunId != null && !(requestedComposeArchiveRunId ==~ composeReportRunIdPattern)) {
    throw new GradleException("Compose Compiler 报告 runId 只能包含字母、数字、点、下划线和连字符。")
}

def sharedComposeReportsDirectory = layout.buildDirectory.dir("compose_reports")
def officialComposeReportRunDirectory = requestedComposeArchiveVariant == null ? null :
        layout.buildDirectory.dir("compose_report_archives/${requestedComposeArchiveVariant}/${requestedComposeArchiveRunId}")
def activeComposeReportsDirectory = officialComposeReportRunDirectory == null ?
        sharedComposeReportsDirectory :
        officialComposeReportRunDirectory.map { it.dir("raw") }

// 日常增量编译仍写共享目录；正式任务使用唯一目录，避免被测试或其它变体覆盖。
composeCompiler {
    reportsDestination = activeComposeReportsDirectory
    metricsDestination = activeComposeReportsDirectory
}

def sha256Of = { File file ->
    def digest = MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[16 * 1024]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}

def writeComposeReportZip = { File zipFile, File reportRoot, File manifestFile ->
    zipFile.parentFile.mkdirs()
    new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(zipFile))).withCloseable { zip ->
        def files = reportRoot.listFiles()?.findAll { it.isFile() } ?: []
        reportRoot.eachFileRecurse { candidate ->
            if (candidate.isFile() && !files.contains(candidate)) {
                files.add(candidate)
            }
        }
        files.sort { left, right ->
            reportRoot.toPath().relativize(left.toPath()).toString() <=>
                    reportRoot.toPath().relativize(right.toPath()).toString()
        }.each { source ->
            def relativePath = reportRoot.toPath().relativize(source.toPath()).toString().replace('\\', '/')
            def entry = new ZipEntry("raw/${relativePath}")
            entry.time = 0L
            zip.putNextEntry(entry)
            source.withInputStream { input -> input.transferTo(zip) }
            zip.closeEntry()
        }
        def manifestEntry = new ZipEntry("manifest.json")
        manifestEntry.time = 0L
        zip.putNextEntry(manifestEntry)
        manifestFile.withInputStream { input -> input.transferTo(zip) }
        zip.closeEntry()
    }
}

def registerComposeCompilerReportArchive = { String variantName ->
    def capitalizedVariant = variantName.capitalize()
    def prepareTaskName = "prepare${capitalizedVariant}ComposeCompilerReportArchiveInternal"
    def archiveTaskName = "archive${capitalizedVariant}ComposeCompilerReportInternal"
    def generateTaskName = "generate${capitalizedVariant}ComposeCompilerReportArchive"
    def compileTaskName = "compile${capitalizedVariant}Kotlin"

    def prepareTask = tasks.register(prepareTaskName) {
        group = "verification"
        description = "准备 ${variantName} Compose Compiler 正式报告的唯一输出目录。"
        notCompatibleWithConfigurationCache("正式报告每次运行都必须生成唯一 runId。")
        onlyIf { requestedComposeArchiveVariant == variantName }
        doLast {
            def runDirectory = officialComposeReportRunDirectory.get().asFile
            if (runDirectory.exists()) {
                throw new GradleException("Compose Compiler 正式报告目录已存在，拒绝覆盖：${requestedComposeArchiveRunId}")
            }
            if (!new File(runDirectory, "raw").mkdirs()) {
                throw new GradleException("无法创建 Compose Compiler 正式报告目录。")
            }
        }
    }

    tasks.configureEach { compileTask ->
        if (compileTask.name == compileTaskName && requestedComposeArchiveVariant == variantName) {
            dependsOn(prepareTask)
            outputs.upToDateWhen { false }
            outputs.cacheIf { false }
            if (compileTask.metaClass.hasProperty(compileTask, "incremental")) {
                compileTask.incremental = false
            }
        }
    }

    def archiveTask = tasks.register(archiveTaskName) {
        group = "verification"
        description = "校验并归档 ${variantName} Compose Compiler 正式报告。"
        notCompatibleWithConfigurationCache("正式报告会写入带唯一 runId 的归档索引。")
        dependsOn(compileTaskName)
        onlyIf { requestedComposeArchiveVariant == variantName }
        doLast {
            def runDirectory = officialComposeReportRunDirectory.get().asFile
            def rawDirectory = new File(runDirectory, "raw")
            def reportFiles = []
            rawDirectory.eachFileRecurse { candidate ->
                if (candidate.isFile()) {
                    reportFiles.add(candidate)
                }
            }

            def classesFile = reportFiles.find { it.name.endsWith("-classes.txt") }
            def composablesTextFile = reportFiles.find { it.name.endsWith("-composables.txt") }
            def composablesCsvFile = reportFiles.find { it.name.endsWith("-composables.csv") }
            def moduleMetricsFile = reportFiles.find { it.name.endsWith("-module.json") }
            [
                    "classes": classesFile,
                    "composables": composablesTextFile,
                    "skippabilityCsv": composablesCsvFile,
                    "moduleMetrics": moduleMetricsFile,
            ].each { label, file ->
                if (file == null || file.length() == 0L) {
                    throw new GradleException("Compose Compiler 正式报告缺少有效 ${label} 文件。")
                }
            }

            def csvLines = composablesCsvFile.readLines("UTF-8")
            if (csvLines.size() <= 1) {
                throw new GradleException("Compose Compiler composables CSV 只有表头，拒绝归档。")
            }

            def composablesText = composablesTextFile.getText("UTF-8")
            def requiredSentinels = ["fun AppRoot(", "fun ChatScreen(", "fun RoleplayScreen(", "fun SettingsScreen("]
            def missingSentinels = requiredSentinels.findAll { !composablesText.contains(it) }
            if (!missingSentinels.isEmpty()) {
                throw new GradleException("Compose Compiler 正式报告缺少主源码哨兵：${missingSentinels.join(', ')}")
            }

            def sortedFiles = reportFiles.sort { left, right ->
                rawDirectory.toPath().relativize(left.toPath()).toString() <=>
                        rawDirectory.toPath().relativize(right.toPath()).toString()
            }
            def fileEntries = sortedFiles.collect { file ->
                [
                        path: rawDirectory.toPath().relativize(file.toPath()).toString().replace('\\', '/'),
                        sizeBytes: file.length(),
                        sha256: sha256Of(file),
                ]
            }
            def gitCommit = "unknown"
            try {
                def process = new ProcessBuilder("git", "rev-parse", "HEAD")
                        .directory(rootProject.rootDir)
                        .redirectErrorStream(true)
                        .start()
                def output = process.inputStream.getText("UTF-8").trim()
                if (process.waitFor() == 0 && output) {
                    gitCommit = output
                }
            } catch (Exception ignored) {
                // 无 Git 元数据时保留 unknown，不影响报告内容校验。
            }

            def moduleMetrics = new JsonSlurper().parse(moduleMetricsFile)
            def manifest = [
                    schemaVersion: 1,
                    variant: variantName,
                    runId: requestedComposeArchiveRunId,
                    generatedAtEpochMillis: System.currentTimeMillis(),
                    commit: gitCommit,
                    toolchain: [
                            gradle: gradle.gradleVersion,
                            jdk: System.getProperty("java.version"),
                            agp: libs.versions.agp.get(),
                            composeCompiler: libs.versions.composeCompiler.get(),
                    ],
                    sentinels: requiredSentinels,
                    metrics: moduleMetrics,
                    files: fileEntries,
            ]
            def manifestFile = new File(runDirectory, "manifest.json")
            manifestFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator(), "UTF-8")

            def zipFile = new File(runDirectory, "compose-compiler-${variantName}-${requestedComposeArchiveRunId}.zip")
            writeComposeReportZip(zipFile, rawDirectory, manifestFile)
            def latestFile = new File(runDirectory.parentFile, "latest.json")
            def latest = [
                    schemaVersion: 1,
                    variant: variantName,
                    runId: requestedComposeArchiveRunId,
                    manifestRelativePath: "${requestedComposeArchiveRunId}/manifest.json",
                    manifestSha256: sha256Of(manifestFile),
                    archiveRelativePath: "${requestedComposeArchiveRunId}/${zipFile.name}",
                    archiveSha256: sha256Of(zipFile),
            ]
            latestFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(latest)) + System.lineSeparator(), "UTF-8")
            logger.lifecycle("Compose Compiler ${variantName} 正式报告已归档：${runDirectory}")
        }
    }

    tasks.register(generateTaskName) {
        group = "verification"
        description = "全量编译、校验并归档 ${variantName} production Compose Compiler 报告。"
        notCompatibleWithConfigurationCache("正式报告每次运行都必须重新计算唯一 runId。")
        dependsOn(archiveTask)
    }
}

registerComposeCompilerReportArchive("debug")
registerComposeCompilerReportArchive("baseline")

tasks.register("verifyComposeCompilerReportArchives") {
    group = "verification"
    description = "复核 debug / baseline 最新 Compose Compiler 归档及 SHA-256。"
    notCompatibleWithConfigurationCache("校验任务在执行期读取正式归档索引与文件哈希。")
    doLast {
        ["debug", "baseline"].each { variantName ->
            def variantDirectory = layout.buildDirectory.dir("compose_report_archives/${variantName}").get().asFile
            def latestFile = new File(variantDirectory, "latest.json")
            if (!latestFile.isFile()) {
                throw new GradleException("缺少 ${variantName} Compose Compiler 最新归档索引。")
            }
            def latest = new JsonSlurper().parse(latestFile)
            if (latest.variant != variantName || !latest.runId) {
                throw new GradleException("${variantName} Compose Compiler 最新归档索引无效。")
            }
            def manifestFile = new File(variantDirectory, latest.manifestRelativePath.toString())
            def archiveFile = new File(variantDirectory, latest.archiveRelativePath.toString())
            if (!manifestFile.isFile() || sha256Of(manifestFile) != latest.manifestSha256) {
                throw new GradleException("${variantName} Compose Compiler manifest 缺失或哈希不匹配。")
            }
            if (!archiveFile.isFile() || sha256Of(archiveFile) != latest.archiveSha256) {
                throw new GradleException("${variantName} Compose Compiler ZIP 缺失或哈希不匹配。")
            }
            def manifest = new JsonSlurper().parse(manifestFile)
            if (manifest.variant != variantName || manifest.runId != latest.runId ||
                    !(manifest.files instanceof List) || manifest.files.isEmpty()) {
                throw new GradleException("${variantName} Compose Compiler manifest 内容无效。")
            }
        }
        logger.lifecycle("debug / baseline Compose Compiler 正式归档校验通过。")
    }
}

