def narraProfileVerificationRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(Locale.ROOT).contains("verifynarrabaselineprofile")
}
def narraProfileVerificationStartedAt = System.currentTimeMillis()
tasks.configureEach { candidate ->
    if (candidate.name == "compileBaselineArtProfile" && narraProfileVerificationRequested) {
        candidate.outputs.upToDateWhen { false }
        candidate.outputs.cacheIf { false }
    }
}

tasks.register("verifyNarraBaselineProfile") {
    group = "verification"
    description = "验证当前源码与本次 baseline 构建的 Profile 均包含 Narra 应用规则。"
    notCompatibleWithConfigurationCache("验证必须比较本次任务开始时间与当前合并产物。")
    dependsOn("compileBaselineArtProfile")
    doLast {
        def sourceDirectory = file("src/main/generated/baselineProfiles")
        def sourceProfiles = sourceDirectory.exists() ?
                fileTree(sourceDirectory) { include("**/*.txt") }.files.findAll { it.isFile() && it.length() > 0L } : []
        if (sourceProfiles.isEmpty()) {
            throw new GradleException("未找到当前源码 Baseline Profile；请在固定物理设备上运行 app:generateBaselineProfile。")
        }
        def sourceRulePresent = sourceProfiles.any { profile ->
            profile.readLines("UTF-8").any { line -> line.contains("Lcom/example/myapplication/") }
        }
        if (!sourceRulePresent) {
            throw new GradleException("源码 Baseline Profile 不包含 Narra 应用命名空间规则。")
        }

        def mergedProfile = layout.buildDirectory.file(
                "intermediates/combined_art_profile/baseline/compileBaselineArtProfile/baseline-prof.txt",
        ).get().asFile
        if (!mergedProfile.isFile() || mergedProfile.length() == 0L) {
            throw new GradleException("本次 baseline 构建未生成可验证的合并 Profile。")
        }
        if (mergedProfile.lastModified() + 5_000L < narraProfileVerificationStartedAt) {
            throw new GradleException("合并 Profile 不是本次验证任务生成的当前产物，拒绝读取旧 intermediate。")
        }
        def mergedRulePresent = mergedProfile.readLines("UTF-8").any { line ->
            line.contains("Lcom/example/myapplication/")
        }
        if (!mergedRulePresent) {
            throw new GradleException("本次合并 Baseline Profile 不包含 Narra 应用命名空间规则。")
        }

        def reportDirectory = layout.buildDirectory.dir("reports/baseline-profile").get().asFile
        reportDirectory.mkdirs()
        def reportFile = new File(reportDirectory, "verification.json")
        def report = [
                schemaVersion: 1,
                verifiedAtEpochMillis: System.currentTimeMillis(),
                sourceProfiles: sourceProfiles.sort { it.name }.collect { profile ->
                    [
                            path: projectDir.toPath().relativize(profile.toPath()).toString().replace('\\', '/'),
                            sha256: sha256Of(profile),
                    ]
                },
                mergedProfile: [
                        path: buildDir.toPath().relativize(mergedProfile.toPath()).toString().replace('\\', '/'),
                        sha256: sha256Of(mergedProfile),
                ],
                namespace: "Lcom/example/myapplication/",
            ]
        reportFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(report)) + System.lineSeparator(), "UTF-8")
        logger.lifecycle("Narra Baseline Profile 源码与当前合并产物校验通过。")
    }
}

def registerAnnotationProcessorListWorkaround = { String variantName ->
    def capitalizedVariant = variantName.substring(0, 1).toUpperCase() + variantName.substring(1)
    def taskName = "ensure${capitalizedVariant}AnnotationProcessorList"
    def outputPath = layout.buildDirectory.file(
            "intermediates/annotation_processor_list/${variantName}/javaPreCompile${capitalizedVariant}/annotationProcessors.json",
    )
    tasks.register(taskName) {
        outputs.file(outputPath)
        doLast {
            def outputFile = outputPath.get().asFile
            outputFile.parentFile.mkdirs()
            if (!outputFile.exists()) {
                outputFile.text = "[]"
            }
        }
    }
    tasks.matching { it.name == "compile${capitalizedVariant}JavaWithJavac" }.configureEach {
        dependsOn(taskName)
    }
}

registerAnnotationProcessorListWorkaround("debug")

