androidComponents {
    finalizeDsl { extension ->
        // Baseline Profile 插件会在自己的 finalizeDsl 中复制 release 源集，需在其后恢复 baseline-only 入口。
        ["benchmarkRelease", "nonMinifiedRelease"].each { buildTypeName ->
            def sourceSet = extension.sourceSets.getByName(buildTypeName)
            sourceSet.java.setSrcDirs(["src/baseline/java"])
            // 项目 Kotlin 源码沿用 java 目录；显式加入，避免 synthetic 变体只合并 Manifest 却漏编 Provider。
            sourceSet.kotlin.setSrcDirs(["src/baseline/java", "src/baseline/kotlin"])
            sourceSet.assets.setSrcDirs(["src/baseline/assets"])
            sourceSet.res.setSrcDirs(["src/baseline/res"])
            sourceSet.manifest.srcFile("src/baseline/AndroidManifest.xml")
        }
    }

    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def channelName
            def normalizedVersionName
            switch (variant.buildType) {
                case "debug":
                    channelName = devChannelName
                    normalizedVersionName = "${appVersionName}-dev"
                    break
                case "baseline":
                case "benchmarkRelease":
                case "nonMinifiedRelease":
                    channelName = baselineChannelName
                    normalizedVersionName = "${appVersionName}-baseline"
                    break
                default:
                    channelName = releaseChannelName
                    normalizedVersionName = appVersionName
                    break
            }
            def normalizedVersionCode = appVersionCode
            output.outputFileName.set("${appDisplayName}-v${normalizedVersionName}-${normalizedVersionCode}-${channelName}.apk")
        }
    }
}

